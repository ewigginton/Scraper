name: CCL nightly land scraper

on:
  workflow_dispatch:
    inputs:
      price_check_only:
        description: "Only check watched listings for price drops"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  issues: write

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AIRTABLE_LAND_TOKEN: ${{ secrets.AIRTABLE_LAND_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PUPPETEER_SKIP_DOWNLOAD: "true"
      SCRAPER_REPORT_FILE: reports/scraper-report.txt
      DRY_RUN: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run scraper
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.price_check_only }}" = "true" ]; then
            ARGS="$ARGS --price-check-only"
          fi
          ARGS="$ARGS --dry-run"
          node index.js $ARGS

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f reports/scraper-report.txt ]; then
            {
              echo "## CCL Scraper Report"
              echo '```text'
              cat reports/scraper-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No scraper report file was created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scraper report and failed-write queue
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scraper-run-${{ github.run_id }}
          path: |
            reports/
            data/failed-writes/
          if-no-files-found: ignore

      - name: Open GitHub issue on failed run
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CCL scraper dry-run failed - run ${context.runNumber}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The manual CCL scraper dry-run workflow failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'Check the workflow summary and the uploaded scraper artifact for the report and any failed-write queue.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['scraper-alert'],
            });
